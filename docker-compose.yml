name: aiinterviewer

# Инфраструктура для локальной разработки.
# Бэкенд запускается отдельно на хосте и ходит сюда по localhost.

services:
  postgres:
    image: postgres:17-alpine
    container_name: aii-postgres
    environment:
      POSTGRES_DB: aiinterviewer
      POSTGRES_USER: aiinterviewer
      POSTGRES_PASSWORD: aiinterviewer
    ports:
      # 5432 на хосте занят другим проектом
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiinterviewer -d aiinterviewer"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: aii-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: aiinterviewer
      MINIO_ROOT_PASSWORD: aiinterviewer
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web-консоль
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    container_name: aii-minio-init
    depends_on:
      - minio
    entrypoint: >
      sh -c "
      until mc alias set local http://minio:9000 aiinterviewer aiinterviewer; do
        echo 'ждём minio...'; sleep 1;
      done;
      mc mb --ignore-existing local/aiinterviewer;
      mc anonymous set download local/aiinterviewer/public;
      echo 'бакет aiinterviewer готов';
      "
    restart: "no"

  # Распознавание речи. На CPU: в Docker не проброшен nvidia runtime,
  # а faster-whisper и без GPU работает быстрее реального времени.
  asr:
    build:
      context: ./services/asr
      args:
        ASR_MODEL: ${ASR_MODEL:-small}
    container_name: aii-asr
    environment:
      ASR_MODEL: ${ASR_MODEL:-small}
      ASR_DEVICE: cpu
      ASR_COMPUTE_TYPE: int8
      ASR_LANGUAGE: ru
    ports:
      - "8100:8000"
    # Контейнер ходит в MinIO по presigned-ссылке, которую подписал бэкенд
    # на localhost, поэтому нужен доступ к хостовым портам
    extra_hosts:
      - "localhost:host-gateway"

  # Озвучка вопросов, Silero
  tts:
    build: ./services/tts
    container_name: aii-tts
    environment:
      TTS_SPEAKER: xenia
      TTS_SAMPLE_RATE: "24000"
      TTS_THREADS: "4"
      # Паузы по знакам препинания, миллисекунды. Подбираются на слух
      TTS_BREAK_SENTENCE_MS: "800"
      TTS_BREAK_CLAUSE_MS: "350"
      TTS_BREAK_DASH_MS: "250"
      TTS_BREAK_COMMA_MS: "100"
    ports:
      - "8101:8000"

volumes:
  pgdata:
  miniodata:
