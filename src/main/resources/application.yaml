spring:
  application:
    name: aiinterviewer

  # Локальные секреты (ключи API). Файла может не быть — тогда работаем на правилах.
  config:
    import: optional:file:./secrets.yaml

  datasource:
    url: jdbc:postgresql://localhost:5433/aiinterviewer
    username: aiinterviewer
    password: aiinterviewer

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Группы по ролям, а не свалка из всех эндпоинтов
    display-request-duration: true
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  # Публичный URL кандидатских и менеджерских ссылок
  public-base-url: http://localhost:5173

  s3:
    endpoint: http://localhost:9000
    # Адрес, по которому браузер ходит за presigned URL
    public-endpoint: http://localhost:9000
    # Адрес MinIO внутри compose-сети: по нему за медиа ходит сервис asr
    internal-endpoint: http://minio:9000
    region: us-east-1
    bucket: aiinterviewer
    access-key: aiinterviewer
    secret-key: aiinterviewer
    upload-url-ttl: 15m
    download-url-ttl: 1h

  llm:
    base-url: ${LLM_BASE_URL:https://api.deepseek.com/v1}
    # Ключ живёт в secrets.yaml или переменной окружения, в репозитории его нет
    api-key: ${LLM_API_KEY:}
    # auto — взять первую модель, которую отдаёт провайдер
    model: ${LLM_MODEL:deepseek-v4-flash}
    timeout: 180s
    temperature: 0.2
    # Формат структурированного ответа: json_schema (строгая схема, OpenAI и LM Studio),
    # json_object (общий JSON-режим, DeepSeek), none (только промпт).
    # auto — попробовать json_schema и при отказе провайдера перейти на json_object.
    structured-output: ${LLM_STRUCTURED_OUTPUT:auto}
    # Глубина рассуждений: none | low | medium | high.
    # Первое значение — для пауз внутри интервью, второе — для разовых вызовов рекрутера.
    reasoning-effort: ${LLM_REASONING_EFFORT:low}
    reasoning-effort-deep: ${LLM_REASONING_EFFORT_DEEP:high}

  asr:
    base-url: http://localhost:8100
    timeout: 300s
    # Заглушка ASR: имитация задержки распознавания, чтобы экран ожидания был виден
    stub-delay-ms: 2500

  tts:
    base-url: http://localhost:8101
    timeout: 60s
    default-voice: xenia
    # Голоса Silero v4_ru. Список наш: подписи человеческие, состав управляемый
    voices:
      - id: xenia
        name: Ксения, женский
      - id: baya
        name: Байя, женский
      - id: kseniya
        name: Ксения (мягче), женский
      - id: aidar
        name: Айдар, мужской
      - id: eugene
        name: Евгений, мужской

  interview:
    candidate-link-ttl-days: 7
    share-link-ttl-days: 30
    max-answer-duration-sec: 300
    max-followups-per-answer: 2
    max-total-questions: 12

logging:
  level:
    com.itmo.napoleonit.aiinterviewer: DEBUG
